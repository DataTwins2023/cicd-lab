name: ci_113065530

on:
  push:
    branches:
      - "**"
  pull_request:

permissions:
  contents: read
  checks: write

concurrency:
  group: ci-113065530-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verification:
    runs-on: ubuntu-latest
    steps:
      // 下載並安裝 Node.js 22，並使用 npm 快取，下次安裝依賴時會更快
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      // 執行 TypeScript 類型檢查，確保代碼符合類型定義 
      - name: TypeScript typecheck
        run: npm run typecheck
      
      // 執行 Prettier 格式檢查，確保代碼風格一致
      - name: Prettier formatting check
        run: npm run format:check

      // 在主機內建立一個名為 reports 的資料夾，並執行測試，使用 JUnit 報告器將測試結果輸出到 reports/vitest-junit.xml
      - name: Run tests with JUnit reporter
        run: |
          mkdir -p reports
          npm test -- --reporter=default --reporter=junit --outputFile.junit=reports/vitest-junit.xml
      
      - name: Publish Test Report
        uses: mikepenz/action-junit-report@v5
        if: always() # 確保測試失敗時，依然能上傳並顯示報表
        with:
          report_paths: 'reports/vitest-junit.xml'
          detailed_summary: true
          include_passed: true
        